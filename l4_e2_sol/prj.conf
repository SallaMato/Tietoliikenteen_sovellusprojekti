# Logger module
CONFIG_LOG=y

# Button and LED library
CONFIG_DK_LIBRARY=y

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RYHMA4"

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

#laitteistoajurit
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER=y

# Suuremmat BLE-paketit (Data Length Extension & MTU)
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# Yhteyden parametrit. ...MIN_INT ja ...MAX_INT päättävät connection intervallin, 
# eli sen kuinka usein laitteet "heräävät" kommunikoimaan. Kun laitteet eivät
# kommunikoi, bluetooth radio on pois päältä. Pienin mahdollinen arvo on 6. 
# HUOM! Lopullisen arvon päättää central, eli vaikka tässä yritetään asettaa se 
# 6:seen, ei näin välttämättä lopulta tapahdu. 
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Mahdollistaa le_phy_updated callbackin käyttämisen main.c:ssä
CONFIG_BT_USER_PHY_UPDATE=y